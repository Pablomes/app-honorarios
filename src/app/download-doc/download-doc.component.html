<div class="generate-icon">
    <svg class="generate-icon menu-opener" viewBox="0 0 16 16" title="Descarga informe en .pdf" (click)="openPopup()">
        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
        <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
    </svg>
</div>

<div class="download-window-wrapper" #popupWindow>
    <div class="download-window">
        <div class="download-header">
            <div class="download-header-left">
            <svg class="generate-icon" viewBox="0 0 16 16" title="Descarga informe en .pdf">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
            </svg>

            <p class="title">Datos del proyecto</p>
            </div>

            <span class="close" (click)="closePopup()">&times;</span>
        </div>

        <div class="download-content">

            <div class="input-fields">

                <input-field fieldName="projectName" label="Nombre del proyecto:" inputWidth="70%" [isRequired]="true" [hidden]="isHidden()"></input-field>

                <input-field fieldName="location" label="Ubicación del proyecto:" [isRequired]="true" [hidden]="isHidden()"></input-field>

                <input-field fieldName="developer" label="Promotor del proyecto:" inputWidth="60%" [isRequired]="true" [hidden]="isHidden()"></input-field>

                <input-field fieldName="projector" label="Proyectista:" inputWidth="60%" [isRequired]="true" [hidden]="isHidden()"></input-field>

            </div>

            <div class="input-accept-wrapper">

                <div class="input-accept-column">
                <button class="accept-button" (click)="generateDocument()"> Generar informe </button>

                <label class="accept-error-label" [class.has-error]="hasError()"> {{ errorLabel() }} </label>

                </div>
            </div>

        </div>

    </div>
</div>
